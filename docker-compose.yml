# Pool analytics stack (arbitrage monitoring removed).
#
# Uses the existing host PostgreSQL (configured in .env). No postgres service is
# started here. Apply the schema once before first run:
#   psql -h $PG_HOST -U $PG_USER -d $PG_DATABASE -f db/schema.sql
#
# Networking: containers reach the host's PostgreSQL via host.docker.internal
# (mapped to host-gateway), which works on both Docker Desktop (Mac/Windows) and
# Linux. PG_HOST is overridden to host.docker.internal for the containers only;
# .env keeps 127.0.0.1 so host-run `npm` scripts still connect locally. The RPC
# endpoints in .env are LAN addresses and are reachable without host networking.
#
# Pipeline: analytics-init backfills prices + historical pool data once, then
# analytics-collector keeps it current hourly. stake-init/stake-collector do the
# same for ETH/TRON staking history when DATABASE_UNSTAKE_URL is configured.
# analytics-server serves :3000 from the local PostgreSQL tables.

x-pg-host: &pg-host
  PG_HOST: host.docker.internal

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  # One-shot: load Binance prices then backfill historical hourly pool data.
  analytics-init:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: "no"
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        START="$${BACKFILL_START_ISO:-2026-01-01T00:00:00Z}"
        echo "=== Loading Binance prices from $$START ==="
        node quant/collectors/load-binance-prices.js --start-iso "$$START"
        echo "=== Backfilling pool analytics from $$START ==="
        node quant/collectors/backfill-pool-analytics.js --start-iso "$$START" -- --concurrency 12 --rpc-retries 2 --tvl-only
        echo "=== Backfill complete ==="

  # Every 15 min: refresh the recent CEX price tail (REST fills the newest
  # hours the archive zips can't cover — the ref-price line on the pools page
  # and trade-majors live pricing both read token_prices_hourly).
  price-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Price collector starting — refreshes last 2 days every 15 min"
        while true; do
          RECENT=$$(date -u -d '2 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || date -u -v-2d '+%Y-%m-%dT00:00:00Z')
          node quant/collectors/load-binance-prices.js --start-iso "$$RECENT" || true
          sleep 900
        done

  # Hourly: refresh recent prices, then collect the latest incremental window.
  analytics-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    depends_on:
      analytics-init:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Analytics collector starting — runs every hour"
        while true; do
          echo "=== $$(date -u '+%Y-%m-%dT%H:%M:%SZ') collection pass ==="
          RECENT=$$(date -u -d '3 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || date -u -v-3d '+%Y-%m-%dT00:00:00Z')
          node quant/collectors/load-binance-prices.js --start-iso "$$RECENT" || true
          node quant/collectors/collect-pool-analytics.js --out-dir reports/analytics --tvl-only || true
          echo "=== pass complete, sleeping 1 hour ==="
          sleep 3600
        done

  # Hourly: Uniswap token-flow collector (ClickHouse -> Postgres). Independent of
  # the pool collector; shares only read access to token_prices_hourly.
  flow-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Token-flow collector starting — catches up from FLOW_START_ISO, then hourly"
        node quant/collectors/collect-token-flows.js --loop

  # Per-tx swap detail (>= SWAP_DETAIL_MIN_USD) with exact timestamps and
  # trader addresses — feeds event studies and smart-address tracking.
  swap-detail-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Swap-detail collector starting — per-tx swaps >= \$$SWAP_DETAIL_MIN_USD"
        node quant/collectors/collect-swap-details.js --loop

  # AAVE v3 (ETH) + JustLend (TRON) supply/borrow/repay/withdraw/liquidation
  # events. Liquidations are the highest-signal rows for the strategies.
  lending-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Lending collector starting — AAVE v3 + JustLend"
        node quant/collectors/collect-lending-events.js --loop

  # Re-scores trader addresses from swap_details, then mirrors new activity
  # from the top scorers into smart_address_events. Alternates every 10 min.
  smart-address-tracker:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Smart-address tracker starting — score + watch every 10 min"
        while true; do
          node quant/collectors/track-smart-addresses.js || true
          node quant/collectors/track-smart-addresses.js --watch || true
          sleep 600
        done

  # Daily refresh of address labels from two sources: the internal chain_cloud
  # ClickHouse dictionary (79M-row KYA set, enriched only for our own traders)
  # and eth-labels.com. Both feed address_labels: deny list for smart scoring
  # + identity display on the smart dashboard.
  address-labels-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Address-labels collector starting — daily chain-cloud + eth-labels refresh"
        while true; do
          node quant/collectors/collect-chain-cloud-labels.js || true
          node quant/collectors/collect-address-labels.js || true
          sleep 86400
        done

  # Exchange netflow: hourly hot-wallet transfer aggregation (token_cex_flow_
  # hourly) + weekly hot-wallet rediscovery against the chain_cloud dictionary.
  cex-flow-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "CEX-flow collector starting — hourly netflow + weekly wallet refresh"
        M=/tmp/cex-addr-refreshed
        while true; do
          if [ ! -f "$$M" ] || [ -n "$$(find $$M -mtime +7)" ]; then
            node quant/collectors/collect-cex-addresses.js && touch "$$M" || true
          fi
          node quant/collectors/collect-cex-flows.js || true
          sleep 900
        done

  # Binance USDT-M funding rates (full history, incremental) + open interest
  # (30d retention upstream — this accumulates it forward).
  derivatives-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Derivatives collector starting — funding rates + open interest"
        while true; do
          node quant/collectors/collect-derivatives.js || true
          sleep 3600
        done

  # Paper-trading run of the Step1-recommended config (volume-surge signals,
  # majors-only execution, real cost model). With a stable --run-id the run
  # resumes cash/positions from PG on restart, so laptop reboots and overnight
  # WireGuard drops pause it rather than reset it; missed hours are replayed
  # once the flow collector catches up.
  strategy-live:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "volume-surge majors paper trading starting"
        node quant/strategy/run-strategy.js --strategy volume-surge --live \
          --run-id volsurge_majors_live_v1 --trade-majors --cost-model

  # Parallel live paper-trading of the other top Step1 strategies plus the
  # pure-price-momentum benchmark, so forward data ranks them side by side on
  # the dashboard. Same resume semantics as strategy-live (stable run ids).
  strategy-live-composite:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "composite-score majors paper trading starting"
        node quant/strategy/run-strategy.js --strategy composite-score --live \
          --run-id composite_majors_live_v1 --trade-majors --cost-model

  strategy-live-buypressure:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "buy-pressure majors paper trading starting"
        node quant/strategy/run-strategy.js --strategy buy-pressure --live \
          --run-id buypressure_majors_live_v1 --trade-majors --cost-model

  strategy-live-flowmom:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "flow-momentum majors paper trading starting"
        node quant/strategy/run-strategy.js --strategy flow-momentum --live \
          --run-id flowmom_majors_live_v2 --trade-majors --cost-model

  # Pure price momentum, no on-chain gate — the live control group: the gap
  # between this and the flow-gated runs is the live measure of the flow
  # signal's value.
  strategy-live-tsmom:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "ts-momentum benchmark paper trading starting"
        node quant/strategy/run-strategy.js --strategy ts-momentum --live \
          --run-id tsmom_live_v1 --cost-model

  # Fills ERC20 symbol/decimals for newly-seen tokens from the EVM node so the
  # dashboard shows real symbols and human amounts. Loops every ~10 min.
  token-enricher:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Token enricher starting — fills symbol/decimals from the node"
        node quant/collectors/enrich-tokens.js --loop

  # DefiLlama macro history (chain TVL, stablecoin supply, DEX volume) into
  # defi_tvl_daily / stablecoin_supply_daily / dex_volume_daily. Each pass is a
  # full-history refresh; free, keyless API.
  market-data-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "DefiLlama collector starting — TVL/stables/DEX volume every 6h"
        node quant/collectors/collect-defillama.js --loop

  # CoinGecko fundamentals (mcap, FDV, supply, categories) for the traded
  # token universe, most-traded first. Free-tier paced; COINGECKO_API_KEY in
  # .env speeds it up. Long tail fills in gradually across cycles.
  token-metadata-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "CoinGecko token-metadata collector starting"
        node quant/collectors/collect-token-metadata.js --loop

  # One-shot: copy ETH/TRON stake, unstake, and withdrawal history from the
  # chaincloud-fe unstake database into the local analytics PostgreSQL schema.
  stake-init:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: "no"
    extra_hosts: *host-gateway
    environment: *pg-host
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -e
        if [ -z "$${DATABASE_UNSTAKE_URL:-}" ]; then
          echo "DATABASE_UNSTAKE_URL is not set; skipping staking history sync"
          exit 0
        fi
        START="$${STAKE_START_ISO:-}"
        if [ -z "$$START" ]; then START="$${BACKFILL_START_ISO:-2026-01-01T00:00:00Z}"; fi
        CHAINS="$${STAKE_CHAINS:-eth,tron}"
        BATCH_DAYS="$${STAKE_BATCH_DAYS:-14}"
        FULL_REFRESH=""
        if [ "$${STAKE_FULL_REFRESH:-false}" = "true" ]; then FULL_REFRESH="--full-refresh"; fi
        echo "=== Syncing staking history from $$START for $$CHAINS ==="
        node quant/collectors/sync-stake-history.js --chains "$$CHAINS" --from "$$START" --batch-days "$$BATCH_DAYS" $$FULL_REFRESH
        echo "=== Staking history sync complete ==="

  # Hourly: refresh the recent staking window after the initial catch-up.
  stake-collector:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    environment: *pg-host
    depends_on:
      stake-init:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${DATABASE_UNSTAKE_URL:-}" ]; then
          echo "DATABASE_UNSTAKE_URL is not set; staking collector disabled"
          tail -f /dev/null
        fi
        echo "Staking collector starting — refreshes recent ETH/TRON stake, unstake, and withdrawal history hourly"
        CHAINS="$${STAKE_CHAINS:-eth,tron}"
        BATCH_DAYS="$${STAKE_BATCH_DAYS:-14}"
        INTERVAL="$${STAKE_SYNC_INTERVAL_SECONDS:-3600}"
        while true; do
          echo "=== $$(date -u '+%Y-%m-%dT%H:%M:%SZ') staking sync pass ==="
          RECENT=$$(date -u -d '3 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || date -u -v-3d '+%Y-%m-%dT00:00:00Z')
          node quant/collectors/sync-stake-history.js --chains "$$CHAINS" --from "$$RECENT" --batch-days "$$BATCH_DAYS" || true
          echo "=== staking pass complete, sleeping $$INTERVAL seconds ==="
          sleep "$$INTERVAL"
        done

  analytics-server:
    image: node:20-bookworm-slim
    working_dir: /workspace/arbitrage-evaluator
    restart: unless-stopped
    extra_hosts: *host-gateway
    depends_on:
      stake-init:
        condition: service_completed_successfully
    environment: *pg-host
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace
    env_file: .env
    command: >
      node quant/server/serve-analytics.js
